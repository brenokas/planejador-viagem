spring.application.name=planejador

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/planejador}
spring.datasource.username=${DB_USER:planejador}
spring.datasource.password=${DB_PASSWORD:planejador}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health

# Segredo HS256 (mínimo 32 caracteres). Em produção, defina JWT_SECRET no .env.
app.jwt.secret=${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
app.jwt.expiration=30d
# Sem HTTPS na rede local, o cookie não pode ser "Secure".
app.cookie.secure=${COOKIE_SECURE:false}
